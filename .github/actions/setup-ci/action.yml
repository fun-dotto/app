name: Setup CI
description: Restore dependency caches and bootstrap the workspace.

runs:
  using: composite
  steps:
    - name: Cache Dart dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('mise.toml', 'pubspec.lock', 'pubspec.yaml', 'apps/**/pubspec.yaml', 'packages/**/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        github_token: ${{ github.token }}
        cache: true
        working_directory: .

    - name: Bootstrap workspace
      shell: bash
      run: mise bootstrap
