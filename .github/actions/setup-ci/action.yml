name: Setup CI
description: Restore dependency caches and bootstrap the workspace.

runs:
  using: composite
  steps:
    - name: Cache Dart dependencies
      uses: actions/cache@v5
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('mise.toml', 'pubspec.lock', 'pubspec.yaml', 'apps/**/pubspec.yaml', 'packages/**/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Cache Bundler dependencies
      uses: actions/cache@v5
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-bundler-${{ hashFiles('mise.toml', 'Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-bundler-

    - uses: jdx/mise-action@v4
      with:
        github_token: ${{ github.token }}
        cache: true
        working_directory: .

    - name: Install xcodeproj globally for flutterfire_cli
      if: runner.os == 'macOS'
      shell: bash
      run: gem install xcodeproj

    - name: Bootstrap workspace
      shell: bash
      run: mise setup
