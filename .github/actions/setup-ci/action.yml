name: Setup CI
description: >-
  mise.toml に記載されたバージョンで各ツールを公式セットアップアクションから導入し、
  必要に応じて依存関係と設定ファイルを取得する。

inputs:
  flutter:
    description: Flutter をセットアップし、pub の依存関係を取得する
    default: "true"
  config:
    description: dart_defines と Firebase 設定ファイルを取得する (google-github-actions/auth が前提)
    default: "true"
  ruby:
    description: Ruby をセットアップし、Gemfile の依存関係をインストールする
    default: "false"
  java:
    description: Java をセットアップし、Gradle のキャッシュを有効にする
    default: "false"
  spm:
    description: Swift Package Manager の依存関係をキャッシュする (macOS)
    default: "false"

runs:
  using: composite
  steps:
    - name: Read tool versions from mise.toml
      id: versions
      shell: bash
      run: |
        # mise.toml をバージョンの唯一の情報源とし、Renovate の更新をそのまま反映する
        version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" mise.toml; }
        {
          echo "flutter=$(version flutter)"
          echo "ruby=$(version ruby)"
          # mise の "21.0.13+9.0.LTS" 形式を Temurin の "21.0.13+9" 形式に変換する
          echo "java=$(version java | sed 's/\.0\.LTS$//')"
          echo "node=$(version node)"
          echo "gcloud=$(version gcloud)"
          echo "firebase-tools=$(version '"npm:firebase-tools"')"
        } >> "$GITHUB_OUTPUT"

    - if: inputs.flutter == 'true'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ steps.versions.outputs.flutter }}
        # Flutter SDK と pub キャッシュ (pubspec.lock のハッシュがキー) をキャッシュする
        cache: true

    - if: inputs.flutter == 'true'
      shell: bash
      run: flutter pub get

    - if: inputs.java == 'true'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: ${{ steps.versions.outputs.java }}
        cache: gradle

    - if: inputs.ruby == 'true'
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: ${{ steps.versions.outputs.ruby }}
        # bundle install の結果を Gemfile.lock のハッシュをキーにキャッシュする
        bundler-cache: true

    - if: inputs.spm == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Developer/Xcode/DerivedData/Runner-*/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('apps/dotto/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - if: inputs.config == 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        version: ${{ steps.versions.outputs.gcloud }}

    - if: inputs.config == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}

    - if: inputs.config == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-firebase-tools-${{ steps.versions.outputs.firebase-tools }}

    - if: inputs.config == 'true'
      name: Install Firebase CLI
      shell: bash
      run: npm install --global "firebase-tools@${{ steps.versions.outputs.firebase-tools }}"

    - if: inputs.config == 'true'
      name: Fetch dart defines
      shell: bash
      run: |
        mkdir -p apps/dotto/dart_defines
        pids=()
        for env in dev stg prd; do
          gcloud secrets versions access latest --secret="app_dart_define_$env" --project=swift2023groupc > "apps/dotto/dart_defines/$env.json" &
          pids+=($!)
        done
        for pid in "${pids[@]}"; do wait "$pid"; done

    - if: inputs.config == 'true'
      name: Fetch Firebase config
      shell: bash
      run: dart run scripts/fetch_firebase_config.dart
