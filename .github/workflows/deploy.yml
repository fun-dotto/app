name: Deploy

# Release PR に `/deploy <ios|android> <store|prd|stg|dev>` とコメントすると、PR の head をビルドしてデプロイする。
# issue_comment は既定ブランチのワークフロー定義で動くため、変更は main へのマージ後に反映される。
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Release ワークフローがコマンドを投稿する App のボットユーザー
  RELEASE_MANAGER_BOT: dotto-release-manager[bot]

jobs:
  prepare:
    name: Parse deploy command
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/deploy ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      os: ${{ steps.command.outputs.os }}
      environment: ${{ steps.command.outputs.environment }}
      sha: ${{ steps.pr.outputs.sha }}
      version: ${{ steps.pr.outputs.version }}
      build: ${{ steps.pr.outputs.build }}
    steps:
      - name: Parse command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ ! "$COMMENT_BODY" =~ ^/deploy\ (ios|android)\ (store|prd|stg|dev)[[:space:]]*$ ]]; then
            echo "::error::コマンドの形式が不正です。/deploy <ios|android> <store|prd|stg|dev> で指定してください"
            exit 1
          fi
          echo "os=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "environment=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Check commenter permission
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          if [ "$COMMENTER" = "$RELEASE_MANAGER_BOT" ]; then
            exit 0
          fi
          # maintain は write、triage は read として返る
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq .permission)
          if [ "$permission" != "admin" ] && [ "$permission" != "write" ]; then
            echo "::error::${COMMENTER} には write 以上の権限がないためデプロイできません (${permission})"
            exit 1
          fi

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          head_ref=$(jq -r .head.ref <<< "$pr")
          head_repo=$(jq -r .head.repo.full_name <<< "$pr")
          if [[ "$head_ref" != release/* ]]; then
            echo "::error::デプロイは release/ ブランチの PR からのみ実行できます (${head_ref})"
            exit 1
          fi
          # issue_comment はシークレットを使えるため、フォークのコードはビルドしない
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::フォークからの PR はデプロイできません (${head_repo})"
            exit 1
          fi
          sha=$(jq -r .head.sha <<< "$pr")
          full_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/dotto/pubspec.yaml?ref=${sha}" --jq .content \
            | base64 --decode | sed -n 's/^version: *\([0-9.]*+[0-9]*\) *$/\1/p')
          if [ -z "$full_version" ]; then
            echo "::error::pubspec.yaml の version を読み取れません"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${full_version}" >> "$GITHUB_OUTPUT"
          echo "build=${full_version#*+}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge command
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=rocket > /dev/null

  deploy:
    name: Deploy ${{ needs.prepare.outputs.os }} (${{ needs.prepare.outputs.environment }})
    needs: prepare
    # 同じ OS・環境・ビルド番号のデプロイは、新しいコマンドで古い実行をキャンセルする
    concurrency:
      group: deploy-${{ needs.prepare.outputs.os }}-${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.build }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      os: ${{ needs.prepare.outputs.os }}
      environment: ${{ needs.prepare.outputs.environment }}
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      pr-number: ${{ github.event.issue.number }}
    secrets: inherit
