name: Update pubspec.lock

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - '**/pubspec.yaml'
      - '**/pubspec.yml'
      - pubspec.lock
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-workspace:
    name: Resolve pub workspace
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          github_token: ${{ github.token }}
          cache: true
          working_directory: .
      - run: flutter pub get

  update-lock:
    name: Update pubspec.lock
    permissions:
      actions: write
      contents: write
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          github_token: ${{ github.token }}
          cache: true
          working_directory: .
      - name: Update pubspec.lock
        run: flutter pub get
      - name: Commit pubspec.lock and trigger CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock に差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "pubspec.lockを更新"
          git push origin "HEAD:refs/heads/$PR_BRANCH"

          # GITHUB_TOKEN で push したコミットの CI を承認なしで起動する。
          if [ "$PR_IS_DRAFT" = "false" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH"
          fi
