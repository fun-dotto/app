name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: 0 15 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: swift2023groupc
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-ci
      - name: Generate code
        run: |
          for dir in apps/dotto packages/dotto_design_system; do
            (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
          done
      - name: Test
        run: |
          for dir in apps/dotto packages/dotto_design_system; do
            (cd "$dir" && flutter test --no-pub --reporter=failures-only --dart-define=VERBOSE_TEST=false)
          done

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: swift2023groupc
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-ci
      - name: Generate code
        run: |
          for dir in apps/dotto packages/dotto_design_system; do
            (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
          done
      - name: Analyze
        run: dart analyze apps/dotto/ packages/dotto_design_system/ scripts/
      - name: Check format
        run: |
          dart fix --dry-run
          find apps/dotto/lib apps/dotto/test packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Check for diff
        run: |
          if [ -n "$(git diff --name-only -- ':!*.g.dart' ':!*.freezed.dart')" ]; then
            echo "::error::Code is not formatted. Run 'mise format' and commit the changes."
            git diff --name-only -- ':!*.g.dart' ':!*.freezed.dart'
            exit 1
          fi
