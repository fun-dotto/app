name: dotto_workspace
publish_to: none

environment:
  sdk: 3.12.0

workspace:
  - apps/dotto # dotto
  - packages/dotto_api # openapi
  - packages/dotto_design_system # dotto_design_system
dev_dependencies:
  melos: 7.8.2

melos:
  command:
    clean:
      hooks:
        post:
          run: flutter clean
          exec:
            concurrency: 8
  scripts:
    gen:build_runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 8
      packageFilters:
        dependsOn: "build_runner"
    gen:build_runner:watch:
      run: dart run build_runner watch --delete-conflicting-outputs
      exec:
        concurrency: 8
      packageFilters:
        dependsOn: "build_runner"
    test:unit:
      steps:
        - melos run gen:build_runner
        - melos exec --concurrency 8 --dir-exists=test --flutter -- "flutter test -j 8 --reporter=failures-only --dart-define=VERBOSE_TEST=false --no-pub"
    fetch:dart_defines:
      steps:
        - rm -rf ./apps/dotto/dart_defines
        - mkdir -p ./apps/dotto/dart_defines
        - gcloud secrets versions access latest --secret=app_dart_define_dev --project=swift2023groupc > ./apps/dotto/dart_defines/dev.json
        - gcloud secrets versions access latest --secret=app_dart_define_stg --project=swift2023groupc > ./apps/dotto/dart_defines/stg.json
        - gcloud secrets versions access latest --secret=app_dart_define_prd --project=swift2023groupc > ./apps/dotto/dart_defines/prd.json
      packageFilters:
        scope: dotto
