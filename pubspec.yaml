name: dotto_workspace
publish_to: none

environment:
  sdk: 3.14.0

workspace:
  - apps/dotto # dotto
  - packages/dotto_app_api # protobuf
  - packages/dotto_design_system # dotto_design_system
dev_dependencies:
  melos: 7.8.1

melos:
  command:
    clean:
      hooks:
        post:
          run: flutter clean
          exec:
            concurrency: 8
  scripts:
    gen:build_runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 8
      packageFilters:
        dependsOn: "build_runner"
    watch:build_runner:
      run: dart run build_runner watch --delete-conflicting-outputs
      exec:
        concurrency: 8
      packageFilters:
        dependsOn: "build_runner"
    test:unit_tests:
      run: flutter test --reporter=failures-only --dart-define=VERBOSE_TEST=false --no-pub
      exec:
        concurrency: 2
      packageFilters:
        dirExists: test
        flutter: true
    fetch:dart_defines:
      run: |
        rm -rf apps/dotto/dart_defines && mkdir -p apps/dotto/dart_defines
        pids=""
        for env in dev stg prd; do
          gcloud secrets versions access latest --secret=app_dart_define_$env --project=swift2023groupc > apps/dotto/dart_defines/$env.json &
          pids="$pids $!"
        done
        for pid in $pids; do wait $pid || exit 1; done
