name: dotto_workspace
publish_to: none

environment:
  sdk: 3.12.0

workspace:
  - apps/dotto # dotto
  - packages/dotto_api # openapi
  - packages/dotto_design_system # dotto_design_system
dev_dependencies:
  melos: 7.8.0

melos:
  command:
    clean:
      hooks:
        post:
          run: flutter clean
          exec:
            concurrency: 8
  scripts:
    gen:build_runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 8
      packageFilters:
        dependsOn: "build_runner"
    gen:build_runner:watch:
      run: dart run build_runner watch --delete-conflicting-outputs
      exec:
        concurrency: 8
      packageFilters:
        dependsOn: "build_runner"
    test:unit:
      steps:
        - melos run gen:build_runner
        - melos exec --concurrency 8 --dir-exists=test --flutter -- "flutter test -j 8 --reporter=failures-only --dart-define=VERBOSE_TEST=false --no-pub"
    fetch:dart_defines:
      steps:
        - rm -rf ./apps/dotto/dart_defines
        - mkdir -p ./apps/dotto/dart_defines
        - gcloud secrets versions access latest --secret=app_dart_define_dev --project=swift2023groupc > ./apps/dotto/dart_defines/dev.json
        - gcloud secrets versions access latest --secret=app_dart_define_stg --project=swift2023groupc > ./apps/dotto/dart_defines/stg.json
        - gcloud secrets versions access latest --secret=app_dart_define_prd --project=swift2023groupc > ./apps/dotto/dart_defines/prd.json
      packageFilters:
        scope: dotto
    setup:flutterfire:
      # ストア版（flavor 指定なし / jp.ac.fun.dotto）と dev/stg/prd の計4アプリを設定する。
      # `exec` で apps/dotto 配下を作業ディレクトリとするため、パスはパッケージ相対。
      run: >-
        flutterfire configure --project=swift2023groupc --platforms="ios,android" --yes
        --out=lib/firebase_options.dart
        --ios-bundle-id=jp.ac.fun.dotto
        --android-package-name=jp.ac.fun.dotto
        --ios-out=ios/Runner/GoogleService-Info.plist
        --android-out=android/app/google-services.json
        --ios-build-config=Release
        &&
        flutterfire configure --project=swift2023groupc --platforms="ios,android" --yes
        --out=lib/firebase_options_dev.dart
        --ios-bundle-id=jp.ac.fun.dotto.dev
        --android-package-name=jp.ac.fun.dotto.dev
        --ios-out=ios/firebase/dev/GoogleService-Info.plist
        --android-out=android/app/src/dev/google-services.json
        --ios-build-config=Release-dev
        &&
        flutterfire configure --project=swift2023groupc --platforms="ios,android" --yes
        --out=lib/firebase_options_stg.dart
        --ios-bundle-id=jp.ac.fun.dotto.stg
        --android-package-name=jp.ac.fun.dotto.stg
        --ios-out=ios/firebase/stg/GoogleService-Info.plist
        --android-out=android/app/src/stg/google-services.json
        --ios-build-config=Release-stg
        &&
        flutterfire configure --project=swift2023groupc --platforms="ios,android" --yes
        --out=lib/firebase_options_prd.dart
        --ios-bundle-id=jp.ac.fun.dotto.prd
        --android-package-name=jp.ac.fun.dotto.prd
        --ios-out=ios/firebase/prd/GoogleService-Info.plist
        --android-out=android/app/src/prd/google-services.json
        --ios-build-config=Release-prd
      exec:
        concurrency: 1
      packageFilters:
        scope: dotto
