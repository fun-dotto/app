[settings]
minimum_release_age = "24h"

[settings.ruby]
compile = false

[env]
_.path = ["{{env.HOME}}/.pub-cache/bin"]

[tools]
buf = "1.75.0"
flutter = "3.50.0"
gcloud = "591.0.0"
java = "21.0.2"
node = "26.13.0"
"npm:firebase-tools" = "15.34.1"
"npm:rulesync" = "43.4.2"
ruby = "4.0.9"

[tasks.bootstrap]
run = [
  "bundle install",
  "dart pub global activate melos 7.8.1",
  "melos bootstrap",
  { task = "fetch:dart_defines" },
  { task = "fetch:firebase_config" },
  { task = "rulesync" },
]

[tasks."fetch:dart_defines"]
run = "melos run fetch:dart_defines"

[tasks."fetch:firebase_config"]
run = "dart run scripts/fetch_firebase_config.dart"

[tasks.rulesync]
run = "rulesync generate"

[tasks."generate:build_runner"]
run = "melos run gen:build_runner --no-select"

[tasks."watch:build_runner"]
run = "melos run watch:build_runner --no-select"

[tasks."run:app"]
run = [
  { task = "generate:build_runner" },
  "cd apps/dotto && flutter run --flavor dev --dart-define-from-file=dart_defines/dev.json",
]

[tasks."run:widgetbook"]
run = [
  { task = "generate:build_runner" },
  "cd packages/dotto_design_system && flutter run",
]

[tasks.lint]
run = "dart analyze apps/dotto/ packages/dotto_design_system/ scripts/"

[tasks.format]
run = "dart fix --apply && find apps/dotto/lib apps/dotto/test packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 | xargs -0 dart format"

[tasks.format-dry-run]
run = "dart fix --dry-run && find apps/dotto/lib apps/dotto/test packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed"

[tasks.test]
run = "melos run test:unit_tests"
