[settings]
minimum_release_age = "24h"
npm.package_manager = "bun"

[settings.ruby]
compile = false

[tools]
buf = "1.75.0"
bun = "1.4.5"
flutter = "3.50.0"
gcloud = "593.0.0"
java = "21.0.13+9.0.LTS"
node = "26.13.1"
"npm:firebase-tools" = "15.37.0"
"npm:rulesync" = "43.11.0"
ruby = "4.0.10"

[tasks.bootstrap]
description = "依存関係の取得と設定ファイルの取得を行う"
depends = ["install:gems", "install:pub", "fetch:dart_defines", "fetch:firebase_config", "rulesync"]

[tasks."install:gems"]
run = "bundle install"

[tasks."install:pub"]
run = "flutter pub get"

[tasks."fetch:dart_defines"]
run = "dart run melos run fetch:dart_defines"
depends = ["install:pub"]

[tasks."fetch:firebase_config"]
run = "dart run scripts/fetch_firebase_config.dart"

[tasks.rulesync]
run = "rulesync generate"

[tasks."generate:build_runner"]
run = "dart run melos run gen:build_runner --no-select"
depends = ["install:pub"]

[tasks."watch:build_runner"]
run = "dart run melos run watch:build_runner --no-select"
depends = ["install:pub"]

[tasks."run:app"]
dir = "apps/dotto"
depends = ["generate:build_runner"]
run = "flutter run --flavor dev --dart-define-from-file=dart_defines/dev.json"
raw = true

[tasks."run:widgetbook"]
dir = "packages/dotto_design_system"
depends = ["generate:build_runner"]
run = "flutter run"
raw = true

[tasks.lint]
run = "dart analyze apps/dotto/ packages/dotto_design_system/ scripts/"

[tasks.format]
run = "dart fix --apply && find apps/dotto/lib apps/dotto/test packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 | xargs -0 dart format"

[tasks.format-dry-run]
run = "dart fix --dry-run && find apps/dotto/lib apps/dotto/test packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed"

[tasks.test]
depends = ["generate:build_runner"]
run = "dart run melos run test:unit_tests --no-select"
