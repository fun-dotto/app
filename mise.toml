[settings]
minimum_release_age = "7d"

[settings.ruby]
compile = false

[env]
_.path = ["{{env.HOME}}/.pub-cache/bin"]

[tools]
flutter = "3.47.6"
gcloud = "587.0.0"
java = "21.0.2"
node = "26.10.0"
"npm:@openapitools/openapi-generator-cli" = "2.41.0"
"npm:rulesync" = "24.0.0"
ruby = "4.0.7"

[tasks.pre-commit]
run = "dart run scripts/pre_commit.dart"

[tasks.bootstrap]
run = [
  "bundle install",
  "dart pub global activate melos 7.8.1",
  "melos bootstrap",
  { task = "fetch:dart_defines" },
  { task = "rulesync" }
]

[tasks."fetch:dart_defines"]
run = "melos run fetch:dart_defines"

[tasks.rulesync]
run = "rulesync generate"

[tasks."generate:build_runner"]
run = "melos run gen:build_runner --no-select"

[tasks."watch:build_runner"]
run = "melos run watch:build_runner --no-select"

[tasks."generate:openapi"]
run = "openapi-generator-cli generate -i ./openapi/openapi.yaml -g dart-dio -o ./packages/dotto_api"

[tasks."app:run"]
run = [
  { task = "generate:build_runner" },
  "cd apps/dotto && flutter run --flavor dev --dart-define-from-file=dart_defines/dev.json",
]

[tasks."app:widgetbook:run"]
run = [
  { task = "generate:build_runner" },
  "cd apps/dotto && flutter run -t widgetbook/main.dart",
]

[tasks."design_system:widgetbook:run"]
run = [
  { task = "generate:build_runner" },
  "cd packages/dotto_design_system && flutter run",
]

[tasks.lint]
run = "dart analyze apps/dotto/ packages/dotto_design_system/ scripts/"

[tasks.format]
run = "dart fix --apply && find apps/dotto/lib apps/dotto/test apps/dotto/widgetbook packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 | xargs -0 dart format"

[tasks.format-dry-run]
run = "dart fix --dry-run && find apps/dotto/lib apps/dotto/test apps/dotto/widgetbook packages/dotto_design_system/lib scripts -name '*.dart' ! -name '*.freezed.dart' ! -name '*.g.dart' ! -name '*.mocks.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed"

[tasks.test]
run = "melos run test:unit_tests"

# VRT は Linux でのみ実行されるため (他の OS では skip)、CI の Update Goldens ワークフローから使う。
# 削除された Story の基準画像を残さないよう、作り直す。
[tasks."test:golden:update"]
run = [
  { task = "generate:build_runner" },
  "[ \"$(uname)\" = Linux ] || { echo '基準画像は Linux でのみ更新できます。' >&2; exit 1; }",
  "cd apps/dotto && rm -rf test/widgetbook/goldens && flutter test --update-goldens --tags golden test/widgetbook",
]
