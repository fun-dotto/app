# 本番(store flavor / flavor 指定なし)用アイコン。
# flavor 別設定ファイル(flutter_launcher_icons-*.yaml)があると本ファイルは使われないため、
# 更新時はそれらを一時的に退避してから `dart run flutter_launcher_icons` を実行する。
flutter_launcher_icons:
  remove_alpha_ios: true
  ios: true
  android: true
  image_path_ios: "assets/icon.png"
  image_path_android: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
